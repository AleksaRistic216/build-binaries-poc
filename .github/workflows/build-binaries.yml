name: build-binaries.yml
on:
  workflow_dispatch: 
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set tag name from short SHA
        id: set_tag
        run: echo "tag=build-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Install GitHub CLI if not present
        run: |
          if ! command -v gh &> /dev/null; then
            echo "gh CLI not found. Installing..."
            sudo apt update
            sudo apt install gh -y
          else
            echo "gh CLI already installed."
          fi

      - name: Check release status
        id: check_release_status
        run: |
          response=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_tag.outputs.tag }})
          if echo "$response" | grep -q "Not Found"; then
            echo "status=none" >> $GITHUB_OUTPUT
          elif echo "$response" | grep -q "in_progress"; then
            echo "status=in_progress" >> $GITHUB_OUTPUT
          else
            echo "status=ready" >> $GITHUB_OUTPUT
          fi

      - name: Wait until release is no longer in progress
        if: steps.check_release_status.outputs.status == 'in_progress'
        run: |
          echo "Waiting for release to finish..."
          while true; do
            response=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_tag.outputs.tag }})
            if echo "$response" | grep -q "Not Found"; then
              echo "Release not found anymore. Proceeding..."
              break
            elif ! echo "$response" | grep -q "in_progress"; then
              echo "Release is ready. Proceeding..."
              break
            fi
            echo "Still in progress. Sleeping for 10 seconds..."
            sleep 10
          done

      - name: Create in-progress release
        if: steps.check_release_status.outputs.status == 'none'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          echo "Creating in-progress release..."
          if ! gh release create ${{ steps.set_tag.outputs.tag }} \
            --title "Build ${{ steps.set_tag.outputs.tag }}" \
            --notes "in_progress"; then
            echo "Release creation failed, likely due to race condition. Re-checking status..."
            response=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_tag.outputs.tag }})
            if echo "$response" | grep -q "Not Found"; then
              echo "Release still not found. Failing workflow."
              exit 1
            elif echo "$response" | grep -q "in_progress"; then
              echo "Release is in progress. Proceeding..."
            else
              echo "Release is ready. Proceeding..."
            fi
          fi


      - name: Check if artifact exists in release
        id: check_release
        run: |
          response=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.set_tag.outputs.tag }})
          if echo "$response" | grep -q "diff.zip"; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip build if artifact exists
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Artifact already exists, skipping build."

      - name: Build binaries
        if: steps.check_release.outputs.exists != 'true'
        run: |
          echo "Building binaries..."
          sleep 60  # Simulate build time
          echo "Build completed."

      - name: Create artifacts
        if: steps.check_release.outputs.exists != 'true'
        run: |
          echo "Creating artifacts..."
          echo "This is a mock diff file." > diff.txt
          zip diff.zip diff.txt
          echo "<modifications><modification>Mock modification</modification></modifications>" > modifications.xml

      - name: Upload artifacts to release
        if: steps.check_release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release upload ${{ steps.set_tag.outputs.tag }} diff.zip modifications.xml

      - name: Update release notes
        if: steps.check_release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh release edit ${{ steps.set_tag.outputs.tag }} \
            --notes "Automated build artifacts"