name: build-binaries.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI if not present
        run: |
          if ! command -v gh &> /dev/null; then
            echo "gh CLI not found. Installing..."
            sudo apt update
            sudo apt install gh -y
          else
            echo "gh CLI already installed."
          fi

      - name: Check if artifact exists in release
        id: check_release
        run: |
          response=$(curl -s https://api.github.com/repos/AleksaRistic216/build-binaries-poc/releases/tags/${{ github.sha }})
          if echo "$response" | grep -q "Not Found"; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT

      - name: Download artifact from release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Downloading artifact from release..."
          curl -L -o diff.zip https://github.com/${{ github.repository }}/releases/download/${{ github.sha }}/diff.zip
          curl -L -o modifications.xml https://github.com/${{ github.repository }}/releases/download/${{ github.sha }}/modifications.xml

      - name: Skip build if artifact exists
        if: steps.check_release.outputs.exists == 'true'
        run: echo "Artifact already exists, skipping build."

      - name: Build binaries
        if: steps.check_release.outputs.exists != 'true'
        run: |
          echo "Building binaries..."
          sleep 30
          echo "Build completed."

      - name: Create artifacts
        if: steps.check_release.outputs.exists != 'true'
        run: |
          echo "Creating artifacts..."
          echo "This is a mock diff file." > diff.txt
          zip diff.zip diff.txt
          echo "<modifications><modification>Mock modification</modification></modifications>" > modifications.xml

      - name: Upload artifacts to release
        if: steps.check_release.outputs.exists != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.sha }} diff.zip modifications.xml \
            --title "Build ${{ github.sha }}" \
            --notes "Automated build artifacts"
